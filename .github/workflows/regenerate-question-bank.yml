name: Regenerate BuzNeet Question Bank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generateQualityQuestionBank.mjs"
      - ".github/workflows/regenerate-question-bank.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate question bank
        run: node scripts/generateQualityQuestionBank.mjs

      - name: Commit generated bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions.json
          if git diff --cached --quiet; then
            echo "No question-bank changes."
          else
            git commit -m "Regenerate unique BuzNeet question bank"
            git push
          fi
