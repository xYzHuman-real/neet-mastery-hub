name: Build Android APK
run-name: Build BuzNeet installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: buzneet-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK dependencies
        run: CI=1 npx expo install --fix

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Export Android JavaScript bundle
        env:
          EXPO_PUBLIC_TELEGRAM_URL: ${{ secrets.BUZNEET_TELEGRAM_URL }}
        run: npx expo export --platform android

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Configure persistent release signing
        env:
          BUZNEET_KEYSTORE_BASE64: ${{ secrets.BUZNEET_KEYSTORE_BASE64 }}
          BUZNEET_KEYSTORE_PASSWORD: ${{ secrets.BUZNEET_KEYSTORE_PASSWORD }}
          BUZNEET_KEY_ALIAS: ${{ secrets.BUZNEET_KEY_ALIAS }}
        working-directory: android
        run: |
          test -n "$BUZNEET_KEYSTORE_BASE64" || (echo "Missing BUZNEET_KEYSTORE_BASE64 GitHub Actions secret." && exit 1)
          test -n "$BUZNEET_KEYSTORE_PASSWORD" || (echo "Missing BUZNEET_KEYSTORE_PASSWORD GitHub Actions secret." && exit 1)
          test -n "$BUZNEET_KEY_ALIAS" || (echo "Missing BUZNEET_KEY_ALIAS GitHub Actions secret." && exit 1)
          printf '%s' "$BUZNEET_KEYSTORE_BASE64" | base64 --decode > app/buzneet-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          signing = '''    release {
              storeFile file("buzneet-release.keystore")
              storePassword project.findProperty("BUZNEET_KEYSTORE_PASSWORD")
              keyAlias project.findProperty("BUZNEET_KEY_ALIAS")
              keyPassword project.findProperty("BUZNEET_KEYSTORE_PASSWORD")
            }'''

          if "storeFile file(\"buzneet-release.keystore\")" not in s:
              if re.search(r"signingConfigs\s*\{", s):
                  s = re.sub(r"(signingConfigs\s*\{)", r"\1\n" + signing, s, count=1)
              else:
                  s = s.replace("    buildTypes {", "    signingConfigs {\n" + signing + "\n    }\n\n    buildTypes {", 1)

          s = re.sub(
              r"(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug",
              r"\1signingConfig signingConfigs.release",
              s,
              count=1,
          )
          p.write_text(s)

          PY
          echo "BUZNEET_KEYSTORE_PASSWORD=$BUZNEET_KEYSTORE_PASSWORD" >> gradle.properties
          echo "BUZNEET_KEY_ALIAS=$BUZNEET_KEY_ALIAS" >> gradle.properties

      - name: Print persistent Android signing fingerprint
        env:
          BUZNEET_KEYSTORE_PASSWORD: ${{ secrets.BUZNEET_KEYSTORE_PASSWORD }}
          BUZNEET_KEY_ALIAS: ${{ secrets.BUZNEET_KEY_ALIAS }}
        working-directory: android
        run: |
          test -f app/buzneet-release.keystore
          keytool -list -v \
            -keystore app/buzneet-release.keystore \
            -storepass "$BUZNEET_KEYSTORE_PASSWORD" \
            -alias "$BUZNEET_KEY_ALIAS" \
            | grep -E "Alias name:|SHA1:|SHA256:"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BuzNeet-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
