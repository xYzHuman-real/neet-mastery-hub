name: Build Android APK
run-name: Build BuzNeet installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: buzneet-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK dependencies
        run: CI=1 npx expo install --fix

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Verify Firebase Android config
        run: |
          test -f google-services.json
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("google-services.json","utf8")); const a=(c.client||[]).find(x=>x.client_info?.android_client_info?.package_name==="com.buzneet.app"); if(!a) throw new Error("Firebase Android app com.buzneet.app is missing from google-services.json"); if(!(a.oauth_client||[]).some(x=>x.client_type===3)) throw new Error("Firebase web OAuth client is missing from google-services.json"); console.log("Firebase Android config verified for com.buzneet.app");'

      - name: Export Android JavaScript bundle
        env:
          EXPO_PUBLIC_TELEGRAM_URL: ${{ secrets.BUZNEET_TELEGRAM_URL }}
        run: npx expo export --platform android

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Print Android signing fingerprints
        working-directory: android
        run: |
          ./gradlew signingReport --no-daemon
          echo "Add the SHA-1 for the certificate used by the installable build to Firebase Console > Project settings > Your apps > BuzNeet Android > SHA certificate fingerprints if it is not already registered."

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BuzNeet-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
