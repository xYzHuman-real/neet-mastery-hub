name: Generate NEET Question Bank
# BuzNeet content generation is deterministic and review-gated.
# Final generation trigger after series completion.
# Final fallback-series fix trigger.
# Latest fallback metadata fix included.
# Final validation trigger.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/chapters.json"
      - "scripts/generateQualityQuestionBank.mjs"
      - "scripts/validateCompleteQuestionBank.mjs"
      - ".github/workflows/generate-question-bank.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate complete 61-question pools for every chapter and series
        run: node scripts/generateQualityQuestionBank.mjs

      - name: Validate question bank
        run: node scripts/validateQuestionQuality.mjs
      - name: Validate complete 61–199 pools
        run: node scripts/validateCompleteQuestionBank.mjs

      - name: Commit generated bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions.json data/questionBank.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate validated variable-size question bank"
          git pull --rebase origin main
          git push
