<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuzNeet Admin</title><style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px 16px}.card{background:white;border:1px solid #e3e7ef;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #00000008}button{padding:11px 15px;border:0;border-radius:10px;background:#172033;color:white;font-weight:700;cursor:pointer}button.danger{background:#b42318}button.secondary{background:#edf0f5;color:#172033}input,select{width:100%;padding:11px;border:1px solid #d5dbe5;border-radius:10px;margin:7px 0 12px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#687386}.hidden{display:none}.msg{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#ecfdf3;color:#087443}.err{background:#fff0f0;color:#a61b1b}.warn{background:#fff8e6;color:#8a5a00}.user{border:1px solid #e1e6ee;border-radius:12px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:600px){.grid{grid-template-columns:1fr}.user{display:block}.user button{margin-top:8px;width:100%}}</style></head><body><div class="wrap">
<div class="card"><h1>BuzNeet Admin</h1><div class="muted">Private Premium subscription management</div></div>
<section id="loginCard" class="card"><h2>Admin sign in</h2><p class="muted">Use the authorized Google account.</p><button id="loginBtn">Continue with Google</button><div id="loginStatus"></div></section>
<section id="panel" class="hidden">
<div class="card"><b id="adminEmail"></b><p class="muted">Administrator</p><button id="logoutBtn" class="secondary">Sign out</button></div>
<div class="card"><h2>Find user</h2><p class="muted">Search using the email used in BuzNeet.</p><input id="emailSearch" type="email" placeholder="student@gmail.com"><button id="searchBtn">Search</button><div id="searchStatus"></div><div id="results"></div></div>
<div class="card"><h2>Premium</h2><div class="grid"><label>Plan<select id="plan"><option value="monthly" data-days="30" data-price="49">1 Month — ₹49</option><option value="quarterly" data-days="90" data-price="149">3 Months — ₹149</option><option value="halfyear" data-days="180" data-price="249">6 Months — ₹249</option><option value="yearly" data-days="365" data-price="399">12 Months — ₹399</option><option value="twoYear" data-days="730" data-price="799">2 Years — ₹799</option></select></label><label>Payment reference<input id="paymentRef" placeholder="UPI/reference ID"></label></div><div id="selectedUser" class="msg warn">No user selected.</div><br><button id="activateBtn">Activate Premium</button> <button id="deactivateBtn" class="danger">Deactivate</button><div id="actionStatus"></div></div>
</section></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import{getFirestore,collection,query,where,getDocs,getDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAIh-5NUA_Z_QJpPB0sIeh1OgoFi7yH0uA",authDomain:"buzneet.firebaseapp.com",projectId:"buzneet",storageBucket:"buzneet.firebasestorage.app",messagingSenderId:"662275162506",appId:"1:662275162506:web:7214a13b63991809fb8873",measurementId:"G-05VYJL7WEL"};const ADMIN="kundrapurakesh9m2@gmail.com";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});const $=x=>document.getElementById(x);let selected=null;
function msg(id,t,c="msg"){$(id).innerHTML=t?'<div class="'+c+'">'+t+"</div>":""}
function choose(u,ref){selected={u,ref};const active=!!u.premiumActive&&(!u.premiumExpiresAt||Number(u.premiumExpiresAt)>Date.now());$("selectedUser").className="msg "+(active?"ok":"warn");$("selectedUser").innerHTML="<b>"+(u.name||"NEET Aspirant")+"</b><br>"+(u.email||"")+"<br>"+(active?"Premium active":"Premium inactive")+(u.premiumPlan?" · "+u.premiumPlan:"")+(u.premiumExpiresAt?" · expires "+new Date(Number(u.premiumExpiresAt)).toLocaleString():"")}
function result(u,ref){const d=document.createElement("div");d.className="user";d.innerHTML="<div><b>"+(u.name||"NEET Aspirant")+"</b><br><span class='muted'>"+(u.email||"")+"</span></div>";const b=document.createElement("button");b.textContent="Manage";b.onclick=()=>choose(u,ref);d.appendChild(b);$("results").appendChild(d)}
async function search(){ $("results").innerHTML="";const email=$("emailSearch").value.trim().toLowerCase();if(!email){msg("searchStatus","Enter an email.","err");return}msg("searchStatus","Searching...");try{const s=await getDocs(query(collection(db,"users"),where("email","==",email)));if(s.empty){msg("searchStatus","No user found. The user must sign in to BuzNeet at least once.","warn");return}msg("searchStatus",s.size+" user found.","ok");s.forEach(x=>result(x.data(),x.ref))}catch(e){console.error(e);msg("searchStatus","Search failed. Check admin sign-in and Firestore rules.","err")}}
async function activate(){if(!selected){msg("actionStatus","Select a user first.","err");return}const o=$("plan").selectedOptions[0],days=+o.dataset.days,price=+o.dataset.price;try{await updateDoc(selected.ref,{premiumActive:true,premiumPlan:$("plan").value,premiumExpiresAt:Date.now()+days*86400000,premiumActivatedAt:serverTimestamp(),premiumPaymentRef:$("paymentRef").value.trim(),premiumPrice:price});const u=(await getDoc(selected.ref)).data();choose(u,selected.ref);msg("actionStatus","Premium activated successfully.","ok")}catch(e){console.error(e);msg("actionStatus","Activation failed. Check Firestore rules and the selected user.","err")}}
async function deactivate(){if(!selected){msg("actionStatus","Select a user first.","err");return}try{await updateDoc(selected.ref,{premiumActive:false,premiumExpiresAt:null});const u=(await getDoc(selected.ref)).data();choose(u,selected.ref);msg("actionStatus","Premium deactivated.","ok")}catch(e){console.error(e);msg("actionStatus","Deactivation failed.","err")}}
$("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){console.error(e);msg("loginStatus","Google sign-in failed. Add this site's domain under Firebase Authentication → Settings → Authorized domains.","err")}};$("logoutBtn").onclick=()=>signOut(auth);$("searchBtn").onclick=search;$("activateBtn").onclick=activate;$("deactivateBtn").onclick=deactivate;$("emailSearch").onkeydown=e=>{if(e.key==="Enter")search()};
onAuthStateChanged(auth,u=>{if(!u){$("loginCard").classList.remove("hidden");$("panel").classList.add("hidden");return}if((u.email||"").toLowerCase()!==ADMIN.toLowerCase()){msg("loginStatus","This Google account is not authorized.","err");signOut(auth);return}$("loginCard").classList.add("hidden");$("panel").classList.remove("hidden");$("adminEmail").textContent=u.email});
</script></body></html>
